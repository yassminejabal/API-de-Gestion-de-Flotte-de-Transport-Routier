services:
  mongodb:
    image: mongo:6.0
    container_name: fleettrack_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: fleettrack_redis
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: fleettrack_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mongo_data:
  minio_data: